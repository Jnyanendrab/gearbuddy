<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f0f0f0" rx="8"/>
  <!-- Mouse body -->
  <ellipse cx="100" cy="105" rx="40" ry="54" fill="none" stroke="#888" stroke-width="2.5"/>
  <!-- Center button split line -->
  <line x1="100" y1="56" x2="100" y2="118" stroke="#888" stroke-width="2"/>
  <!-- Top button split line -->
  <line x1="60" y1="97" x2="140" y2="97" stroke="#888" stroke-width="2"/>
  <!-- Scroll wheel -->
  <rect x="93" y="68" width="14" height="22" rx="4" fill="none" stroke="#888" stroke-width="2"/>
  <line x1="93" y1="79" x2="107" y2="79" stroke="#888" stroke-width="1.5"/>
  <!-- Side thumb button hint -->
  <rect x="60" y="108" width="8" height="12" rx="2" fill="#aaa"/>
  <text x="100" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">MX Master 3S</text>
</svg>
