<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f0f0f0" rx="8"/>
  <!-- Left monitor -->
  <rect x="12" y="58" width="72" height="52" rx="4" fill="none" stroke="#888" stroke-width="2"/>
  <rect x="16" y="62" width="64" height="44" rx="2" fill="#d8d8d8"/>
  <!-- Right monitor -->
  <rect x="116" y="58" width="72" height="52" rx="4" fill="none" stroke="#888" stroke-width="2"/>
  <rect x="120" y="62" width="64" height="44" rx="2" fill="#d8d8d8"/>
  <!-- Center bracket / arm post -->
  <rect x="93" y="78" width="14" height="60" rx="3" fill="#aaa" stroke="#888" stroke-width="1.5"/>
  <!-- Arm to left monitor -->
  <line x1="93" y1="90" x2="48" y2="90" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <line x1="48" y1="90" x2="84" y2="84" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <!-- Arm to right monitor -->
  <line x1="107" y1="90" x2="152" y2="90" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <line x1="152" y1="90" x2="116" y2="84" stroke="#888" stroke-width="2" stroke-linecap="round"/>
  <!-- Base -->
  <rect x="80" y="136" width="40" height="8" rx="4" fill="#aaa"/>
  <text x="100" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">HUANUO Dual Arm</text>
</svg>
