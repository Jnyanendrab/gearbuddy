<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f0f0f0" rx="8"/>
  <!-- Desk underside edge -->
  <rect x="20" y="68" width="160" height="12" rx="3" fill="#c8b89a" stroke="#a89070" stroke-width="1.5"/>
  <!-- Cable tray body -->
  <rect x="30" y="80" width="140" height="45" rx="5" fill="none" stroke="#888" stroke-width="2.5"/>
  <!-- Mesh pattern horizontal lines -->
  <line x1="30" y1="93" x2="170" y2="93" stroke="#bbb" stroke-width="1.2"/>
  <line x1="30" y1="106" x2="170" y2="106" stroke="#bbb" stroke-width="1.2"/>
  <line x1="30" y1="119" x2="170" y2="119" stroke="#bbb" stroke-width="1.2"/>
  <!-- Mesh pattern vertical lines -->
  <line x1="50" y1="80" x2="50" y2="125" stroke="#bbb" stroke-width="1.2"/>
  <line x1="70" y1="80" x2="70" y2="125" stroke="#bbb" stroke-width="1.2"/>
  <line x1="90" y1="80" x2="90" y2="125" stroke="#bbb" stroke-width="1.2"/>
  <line x1="110" y1="80" x2="110" y2="125" stroke="#bbb" stroke-width="1.2"/>
  <line x1="130" y1="80" x2="130" y2="125" stroke="#bbb" stroke-width="1.2"/>
  <line x1="150" y1="80" x2="150" y2="125" stroke="#bbb" stroke-width="1.2"/>
  <!-- Mounting clips -->
  <rect x="38" y="66" width="10" height="16" rx="2" fill="#999" stroke="#777" stroke-width="1"/>
  <rect x="152" y="66" width="10" height="16" rx="2" fill="#999" stroke="#777" stroke-width="1"/>
  <!-- Cables hanging out bottom -->
  <path d="M 70 125 Q 65 145 72 155" fill="none" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 90 125 Q 95 148 88 158" fill="none" stroke="#f5a623" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 110 125 Q 108 142 115 152" fill="none" stroke="#6aaa6a" stroke-width="2.5" stroke-linecap="round"/>
  <text x="100" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">SOLEJAZZ Cable Tray</text>
</svg>
