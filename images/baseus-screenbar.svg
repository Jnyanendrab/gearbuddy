<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f0f0f0" rx="8"/>
  <!-- Monitor base -->
  <rect x="70" y="145" width="60" height="8" rx="2" fill="#aaa"/>
  <rect x="93" y="130" width="14" height="16" fill="#aaa"/>
  <!-- Monitor screen -->
  <rect x="40" y="80" width="120" height="52" rx="4" fill="none" stroke="#888" stroke-width="2.5"/>
  <rect x="45" y="85" width="110" height="42" rx="2" fill="#d8d8d8"/>
  <!-- Light bar on top of monitor -->
  <rect x="38" y="72" width="124" height="10" rx="5" fill="#f5c842" stroke="#c8a800" stroke-width="1.5"/>
  <!-- Light rays -->
  <line x1="60" y1="72" x2="55" y2="62" stroke="#f5c842" stroke-width="1.5" opacity="0.7"/>
  <line x1="100" y1="72" x2="100" y2="62" stroke="#f5c842" stroke-width="1.5" opacity="0.7"/>
  <line x1="140" y1="72" x2="145" y2="62" stroke="#f5c842" stroke-width="1.5" opacity="0.7"/>
  <text x="100" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">Baseus ScreenBar</text>
</svg>
