<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f0f0f0" rx="8"/>
  <!-- Monitor base -->
  <rect x="70" y="145" width="60" height="8" rx="2" fill="#aaa"/>
  <rect x="93" y="130" width="14" height="16" fill="#aaa"/>
  <!-- Monitor screen -->
  <rect x="40" y="82" width="120" height="50" rx="4" fill="none" stroke="#888" stroke-width="2.5"/>
  <rect x="45" y="87" width="110" height="40" rx="2" fill="#d8d8d8"/>
  <!-- Front light bar -->
  <rect x="42" y="74" width="116" height="10" rx="5" fill="#a8d8ff" stroke="#6699cc" stroke-width="1.5"/>
  <!-- Back halo glow bar -->
  <rect x="38" y="130" width="124" height="8" rx="4" fill="#a8d8ff" stroke="#6699cc" stroke-width="1" opacity="0.8"/>
  <!-- Halo glow -->
  <ellipse cx="100" cy="134" rx="55" ry="14" fill="none" stroke="#a8d8ff" stroke-width="3" opacity="0.4"/>
  <text x="100" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">BenQ ScreenBar Halo</text>
</svg>
