<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f0f0f0" rx="8"/>
  <!-- Mouse body -->
  <ellipse cx="100" cy="105" rx="38" ry="52" fill="none" stroke="#888" stroke-width="2.5"/>
  <!-- Center button split line -->
  <line x1="100" y1="58" x2="100" y2="115" stroke="#888" stroke-width="2"/>
  <!-- Left/right button split line -->
  <line x1="62" y1="95" x2="138" y2="95" stroke="#888" stroke-width="2"/>
  <!-- Scroll wheel -->
  <rect x="93" y="70" width="14" height="20" rx="4" fill="none" stroke="#888" stroke-width="2"/>
  <line x1="93" y1="80" x2="107" y2="80" stroke="#888" stroke-width="1.5"/>
  <text x="100" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">Logitech Lift</text>
</svg>
