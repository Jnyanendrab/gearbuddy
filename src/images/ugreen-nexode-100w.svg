<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f0f0f0" rx="8"/>
  <!-- Charger body -->
  <rect x="65" y="55" width="70" height="90" rx="12" fill="none" stroke="#888" stroke-width="2.5"/>
  <!-- Prongs -->
  <rect x="84" y="143" width="10" height="20" rx="3" fill="none" stroke="#888" stroke-width="2"/>
  <rect x="106" y="143" width="10" height="20" rx="3" fill="none" stroke="#888" stroke-width="2"/>
  <!-- USB-C ports on side -->
  <rect x="135" y="75" width="12" height="7" rx="2" fill="none" stroke="#888" stroke-width="1.5"/>
  <rect x="135" y="90" width="12" height="7" rx="2" fill="none" stroke="#888" stroke-width="1.5"/>
  <rect x="135" y="105" width="12" height="7" rx="2" fill="none" stroke="#888" stroke-width="1.5"/>
  <!-- USB-A port -->
  <rect x="135" y="120" width="12" height="8" rx="1" fill="none" stroke="#888" stroke-width="1.5"/>
  <!-- GaN label -->
  <text x="100" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="bold" fill="#888">GaN</text>
  <text x="100" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">Ugreen Nexode 100W</text>
</svg>
