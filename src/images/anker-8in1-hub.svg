<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f0f0f0" rx="8"/>
  <!-- Hub body -->
  <rect x="45" y="72" width="110" height="68" rx="10" fill="none" stroke="#888" stroke-width="2.5"/>
  <!-- USB cable on left -->
  <line x1="30" y1="106" x2="45" y2="106" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <rect x="20" y="100" width="12" height="12" rx="2" fill="none" stroke="#888" stroke-width="2"/>
  <!-- Port slots on right side -->
  <rect x="153" y="82" width="10" height="7" rx="1.5" fill="none" stroke="#888" stroke-width="1.5"/>
  <rect x="153" y="94" width="10" height="7" rx="1.5" fill="none" stroke="#888" stroke-width="1.5"/>
  <rect x="153" y="106" width="10" height="7" rx="1.5" fill="none" stroke="#888" stroke-width="1.5"/>
  <rect x="153" y="118" width="10" height="8" rx="1.5" fill="none" stroke="#888" stroke-width="1.5"/>
  <!-- Port slots on bottom -->
  <rect x="62" y="138" width="9" height="7" rx="1.5" fill="none" stroke="#888" stroke-width="1.5"/>
  <rect x="76" y="138" width="9" height="7" rx="1.5" fill="none" stroke="#888" stroke-width="1.5"/>
  <rect x="90" y="138" width="9" height="7" rx="1.5" fill="none" stroke="#888" stroke-width="1.5"/>
  <rect x="104" y="138" width="9" height="7" rx="1.5" fill="none" stroke="#888" stroke-width="1.5"/>
  <!-- Label -->
  <text x="100" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#aaa">8-in-1</text>
  <text x="100" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">Anker 8-in-1 Hub</text>
</svg>
